# ===============================================
# Nyverune Hyprlock Configuration
# Beautiful lockscreen with dynamic Pywal colors, avatar & status
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# ===============================================

# Fallback tokens in case pywal cache has not been populated
$wallpaper = /home/nyverune/.config/hypr/assets/current_wallpaper.jpg
$primary = rgb(A855F7)
$secondary = rgb(FF5CB8)
$accent = rgb(C084FC)
$muted = rgb(8B8297)
$background = rgb(100D16)
$foreground = rgb(F6F0FC)
$error = rgb(FF5C72)
$border = rgb(2E2242)

# Source dynamic Pywal colors
source = ~/.cache/wal/colors-hyprland.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

# -------------------------------------------------------------
# Background: Mascot Kernel Panic wallpaper with subtle blur
# -------------------------------------------------------------
background {
    monitor =
    path = $wallpaper
    color = $background

    # Subtle aesthetic blur
    blur_passes = 2
    blur_size = 5
    noise = 0.0117
    contrast = 0.89
    brightness = 0.78
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# -------------------------------------------------------------
# Battery: Top-Right status pill
# -------------------------------------------------------------
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/battery.sh
    color = $foreground
    font_size = 12
    font_family = JetBrainsMono Nerd Font DemiBold
    position = -30, -20
    halign = right
    valign = top
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}

# -------------------------------------------------------------
# Time (Hora): Clean bold clock
# -------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $foreground
    font_size = 54
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.7)
}

# -------------------------------------------------------------
# Date (Fecha): Formatted date
# -------------------------------------------------------------
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $accent
    font_size = 15
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.7)
}

# -------------------------------------------------------------
# Avatar Image: Circular profile picture
# -------------------------------------------------------------
image {
    monitor =
    path = /home/nyverune/.config/hypr/assets/avatar.jpg
    size = 110
    rounding = -1
    border_size = 3
    border_color = $primary
    position = 0, 15
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

# -------------------------------------------------------------
# User Greeting
# -------------------------------------------------------------
label {
    monitor =
    text = $USER
    color = $foreground
    font_size = 13
    font_family = JetBrainsMono Nerd Font SemiBold
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.7)
}

# -------------------------------------------------------------
# Password Input Field
# -------------------------------------------------------------
input-field {
    monitor =
    size = 250, 44
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    outer_color = $primary
    inner_color = rgba(16, 13, 22, 0.65)
    font_color = $foreground

    fade_on_empty = false
    placeholder_text = <span font_family="JetBrainsMono Nerd Font">󰌾 Input Password...</span>
    hide_input = false
    rounding = 12

    check_color = $accent
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position = 0, -110
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}
